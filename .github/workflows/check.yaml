name: Check

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Check
        run: npm run staged

      - name: Build Cloudflare Worker (no deployment)
        run: npm run build:cloudflare
